<!DOCTYPE html>
<html>
<head>
  <title>Click Event</title>
</head>
<body>
  <button id="btn" onclick="handleClick()">Click Me</button>

  <script>

    function handleClick() {
      alert('Button clicked!');
    }
    document.getElementById('btn').onclick = handleClick;
  </script>
</body>
</html>
