<!DOCTYPE html>
<html>

<head>
    <title>Input Field Events Example</title>
    <style>
        .focused {
            border: 2px solid blue;
        }

        .blurred {
            border: 1px solid black;
        }
    </style>
</head>

<body>

    <input type="text" id="myInput" placeholder="Type here">
    <p id="inputStatus"></p>
    <p id="changeStatus"></p>
    <p id="focusStatus"></p>
    <p id="blurStatus"></p>

    <script src="script.js"></script>
</body>

</html>
