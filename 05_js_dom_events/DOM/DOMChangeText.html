<!DOCTYPE html>
<html>
<head>
  <title>DOM Manipulation</title>
</head>
<body>
  <h1 id="myHeading">Welcome!</h1>
  <button onclick="changeText()">Click me</button>

  <script>
    function changeText() {
      const heading = document.getElementById('myHeading');
      heading.textContent = 'Hello World!';
    }
  </script>
</body>
</html>
