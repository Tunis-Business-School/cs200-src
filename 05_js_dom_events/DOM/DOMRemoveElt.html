<!DOCTYPE html>
<html>
<head>
  <title>DOM Manipulation</title>
</head>
<body>
  <ul id="myList">
    <li>Item 1</li>
    <li>Item 2</li>
    <li>Item 3</li>
  </ul>
  <button onclick="removeItem()">Remove Item</button>

  <script>
    function removeItem() {
      const myList = document.getElementById('myList');
      const lastItem = myList.lastElementChild;
      myList.removeChild(lastItem);
    }
  </script>
</body>
</html>
