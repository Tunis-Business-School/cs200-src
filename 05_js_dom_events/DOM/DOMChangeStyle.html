<!DOCTYPE html>
<html>
<head>
  <title>DOM Manipulation</title>
  <style>
    .highlight {
      color: blue;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <p id="myPara">This is a paragraph.</p>
  <button onclick="changeStyle()">Highlight Text</button>

  <script>
    function changeStyle() {
      const paragraph = document.getElementById('myPara');
     // paragraph.classList.add('highlight');
      paragraph.style.color = 'red';
    }
  </script>
</body>
</html>
